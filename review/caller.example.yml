# Copy to .github/workflows/pull-review.yml in a PUBLIC repo after central review.
# Replace the ref with the reviewed central commit SHA. This template is not active.
name: Pull review pilot

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open pull request number
        required: true
        type: number
      publish:
        description: Publish one review and status rather than only an artifact
        default: false
        type: boolean

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: thebytefarm/.github/.github/workflows/pull-review.yml@REPLACE_WITH_ENGINE_COMMIT_SHA
    with:
      pr-number: ${{ inputs.pr-number }}
      publish: ${{ inputs.publish }}
    secrets:
      SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
