name: Parallel pull review
on:
  workflow_call:
    inputs:
      engine-ref:
        description: Same reviewed central commit SHA as the caller's uses ref
        required: true
        type: string
      pr-number:
        required: true
        type: number
      publish:
        default: false
        type: boolean
      auto-merge:
        description: Merge only approved low-risk non-release PRs after CI passes
        default: false
        type: boolean
    secrets:
      SYNTHETIC_API_KEY:
        required: true

permissions: {}
concurrency:
  group: bytefarm-engine-${{ github.repository }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository_owner == 'thebytefarm' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      head-repository: ${{ steps.prepare.outputs.head-repository }}
      seconds: ${{ steps.prepare.outputs.reviewer-seconds }}
      verdict-seconds: ${{ steps.prepare.outputs.verdict-seconds }}
      verdict-model: ${{ steps.prepare.outputs.verdict-model }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Prepare config, prompts, and diff
        id: prepare
        run: node engine/review/prepare.mts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          ENGINE_REF: ${{ inputs.engine-ref }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-input
          path: context/
          retention-days: 7

  review:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Review / ${{ matrix.role }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-input
          path: context
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: source
          persist-credentials: false
      - name: Check out PR source as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.prepare.outputs.head-repository }}
          ref: ${{ needs.prepare.outputs.head }}
          path: head
          persist-credentials: false
      - name: Run isolated read-only specialist
        run: |
          mkdir -p results
          node engine/review/agent.mts
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          PROMPT_PATH: context/${{ matrix.role }}.md
          OUTPUT_SCHEMA: ${{ matrix.schema }}
          MODEL: ${{ matrix.model }}
          CONTEXT: ${{ matrix.context }}
          MAX_OUTPUT: ${{ matrix.output }}
          SECONDS: ${{ needs.prepare.outputs.seconds }}
          ROLE: ${{ matrix.role }}
          RESULT_PATH: results/${{ matrix.role }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-result-${{ matrix.role }}
          path: results/${{ matrix.role }}.json
          retention-days: 7

  finish:
    if: always() && !cancelled() && needs.prepare.result == 'success'
    needs: [prepare, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-input
          path: context
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: review-result-*
          path: results
          merge-multiple: true
      - name: Check specialist completeness
        id: collect
        run: node engine/review/finish.mts collect
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
      - name: Summarize using the cheaper model
        if: steps.collect.outputs.complete == 'true'
        id: agent
        run: node engine/review/agent.mts
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          PROMPT_PATH: context/verdict.md
          OUTPUT_SCHEMA: ${{ steps.collect.outputs.schema }}
          MODEL: ${{ fromJSON(needs.prepare.outputs.verdict-model).model }}
          CONTEXT: ${{ fromJSON(needs.prepare.outputs.verdict-model).context }}
          MAX_OUTPUT: ${{ fromJSON(needs.prepare.outputs.verdict-model).output }}
          SECONDS: ${{ needs.prepare.outputs.verdict-seconds }}
          ROLE: verdict
          RESULT_PATH: context/synthesis.json
      - name: Compute verdict without GitHub credentials
        if: always() && steps.collect.outcome == 'success'
        run: node engine/review/finish.mts render
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          SYNTHESIS_RESULT: ${{ steps.agent.outcome }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review-decision
          path: |
            context/review.md
            context/decision.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    if: always() && !cancelled() && inputs.publish && needs.prepare.result == 'success'
    needs: [prepare, finish]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-decision
          path: context
      - id: identity
        uses: pullfrog/pullfrog/get-installation-token@8302038bc7ab13f579cfef4bad72941b87f8c1c5 # v0
      - name: Publish and enforce the merge gate
        run: node engine/review/publish.mts
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          REVIEW_HEAD: ${{ needs.prepare.outputs.head }}
          REVIEW_BASE: ${{ needs.prepare.outputs.base }}
