name: Parallel pull review
on:
  workflow_call:
    inputs:
      engine-ref:
        description: Same reviewed central commit SHA as the caller's uses ref
        required: true
        type: string
      pr-number:
        required: true
        type: number
      publish:
        default: false
        type: boolean
    secrets:
      SYNTHETIC_API_KEY:
        required: true

permissions: {}
concurrency:
  group: bytefarm-engine-${{ github.repository }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository_owner == 'thebytefarm' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      schema: ${{ steps.prepare.outputs.review-schema }}
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      head-repository: ${{ steps.prepare.outputs.head-repository }}
      seconds: ${{ steps.prepare.outputs.reviewer-seconds }}
      verdict-seconds: ${{ steps.prepare.outputs.verdict-seconds }}
      verdict-model: ${{ steps.prepare.outputs.verdict-model }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - if: inputs.publish
        id: identity
        uses: pullfrog/pullfrog/get-installation-token@8302038bc7ab13f579cfef4bad72941b87f8c1c5 # v0
      - name: Prepare config, prompts, and diff
        id: prepare
        run: node engine/review/prepare.mts
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          ENGINE_REF: ${{ inputs.engine-ref }}
          PUBLISH: ${{ inputs.publish }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-input
          path: context/
          retention-days: 7

  review:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Review / ${{ matrix.role }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-input
          path: context
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: source
          persist-credentials: false
      - name: Check out PR source as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.prepare.outputs.head-repository }}
          ref: ${{ needs.prepare.outputs.head }}
          path: head
          persist-credentials: false
      - uses: pullfrog/pullfrog@8302038bc7ab13f579cfef4bad72941b87f8c1c5 # v0
        id: agent
        with:
          prompt_file: context/${{ matrix.role }}.md
          output_schema: ${{ needs.prepare.outputs.schema }}
          model: openai-compatible/byok
          effort: high
          timeout: ${{ needs.prepare.outputs.seconds }}s
          push: disabled
          shell: disabled
          progress_comments: disabled
          cwd: source
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://api.synthetic.new/openai/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ matrix.model }}
          OPENAI_COMPATIBLE_CONTEXT: ${{ matrix.context }}
          OPENAI_COMPATIBLE_MAX_OUTPUT: ${{ matrix.output }}
      - name: Save structured result
        run: |
          mkdir -p results
          jq -e . <<< "$RESULT" > "results/$ROLE.json"
        env:
          ROLE: ${{ matrix.role }}
          RESULT: ${{ steps.agent.outputs.result }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-result-${{ matrix.role }}
          path: results/${{ matrix.role }}.json
          retention-days: 7

  finish:
    if: always() && !cancelled() && needs.prepare.result == 'success'
    needs: [prepare, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thebytefarm/.github
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-input
          path: context
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: review-result-*
          path: results
          merge-multiple: true
      - name: Check specialist completeness
        id: collect
        run: node engine/review/finish.mts collect
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
      - name: Summarize using the cheaper model
        if: steps.collect.outputs.complete == 'true'
        id: agent
        uses: pullfrog/pullfrog@8302038bc7ab13f579cfef4bad72941b87f8c1c5 # v0
        with:
          prompt_file: context/verdict.md
          output_schema: ${{ steps.collect.outputs.schema }}
          model: openai-compatible/byok
          effort: low
          timeout: ${{ needs.prepare.outputs.verdict-seconds }}s
          push: disabled
          shell: disabled
          progress_comments: disabled
          # Pullfrog probes Git before starting; artifacts alone are not a checkout.
          cwd: engine
        env:
          OPENAI_COMPATIBLE_BASE_URL: https://api.synthetic.new/openai/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ fromJSON(needs.prepare.outputs.verdict-model).model }}
          OPENAI_COMPATIBLE_CONTEXT: ${{ fromJSON(needs.prepare.outputs.verdict-model).context }}
          OPENAI_COMPATIBLE_MAX_OUTPUT: ${{ fromJSON(needs.prepare.outputs.verdict-model).output }}
      - if: always() && inputs.publish
        id: identity
        uses: pullfrog/pullfrog/get-installation-token@8302038bc7ab13f579cfef4bad72941b87f8c1c5 # v0
      - name: Compute verdict and optionally publish
        if: always() && steps.collect.outcome == 'success'
        run: node engine/review/finish.mts publish
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          PUBLISH: ${{ inputs.publish }}
          REVIEW_RESULT: ${{ needs.review.result }}
          SYNTHESIS_RESULT: ${{ steps.agent.outcome }}
          AGENT_RESULT: ${{ steps.agent.outputs.result }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review-summary
          path: context/review.md
          retention-days: 7
          if-no-files-found: ignore
