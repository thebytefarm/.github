name: Review engine tests

on:
  pull_request:
    paths:
      - review/**
      - .github/workflows/pull-review.yml
      - .github/workflows/review-tests.yml
  push:
    branches: [main]
    paths:
      - review/**
      - .github/workflows/pull-review.yml
      - .github/workflows/review-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install pinned Codex for sandbox probes
        run: npm install --global @openai/codex@0.166.0
      - name: Enable the managed Linux sandbox
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: node --test review/*.test.mts
        env:
          CODEX_SANDBOX_TESTS: "true"
