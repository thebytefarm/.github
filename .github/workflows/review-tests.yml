name: Review engine tests

on:
  pull_request:
    paths:
      - review/**
      - .github/workflows/pull-review.yml
      - .github/workflows/review-tests.yml
  push:
    branches: [main]
    paths:
      - review/**
      - .github/workflows/pull-review.yml
      - .github/workflows/review-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test review/*.test.mts
