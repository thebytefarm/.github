name: Review scheduling probe
on:
  workflow_call:
    inputs:
      engine-ref:
        required: true
        type: string
      pr-number:
        required: true
        type: number
      publish:
        default: false
        type: boolean
      auto-merge:
        default: false
        type: boolean
    secrets:
      CODEX_AUTH_JSON:
        required: true
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo 'Reusable workflow scheduled successfully; no credentials accessed.'
